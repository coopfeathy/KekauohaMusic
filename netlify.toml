[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/admin/submissions"
  to = "/.netlify/functions/submissions-list"
  status = 200

[[redirects]]
  from = "/api/admin/submissions/update"
  to = "/.netlify/functions/submissions-update"
  status = 200

[[redirects]]
  from = "/api/admin/testimonials"
  to = "/.netlify/functions/testimonials-list"
  status = 200

[[redirects]]
  from = "/api/admin/testimonials/update"
  to = "/.netlify/functions/testimonials-update"
  status = 200

[[redirects]]
  from = "/api/testimonials"
  to = "/.netlify/functions/testimonials-list"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://identity.netlify.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.netlify.com https://identity.netlify.com https://kekauoha-music.netlify.app https://www.google-analytics.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
